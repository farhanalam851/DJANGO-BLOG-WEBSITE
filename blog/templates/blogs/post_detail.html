{% extends "blogs/base.html" %}

{% block content %}

<article class="media content-section">
    <div class="media-body">


    <div class="article-metadata">
        <a href="{% url 'user-posts' object.author.username %}">
            {{ object.author }}
        </a>

        <small class="text-muted">
            {{ object.published_date|date:"F d, Y" }}
        </small>
    </div>

    <h2 class="article-title">
        {{ object.title }}
    </h2>

    <p class="article-content">
        {{ object.content }}
    </p>

    <!-- ❤️ Like Button -->
    <form action="{% url 'like-post' object.pk %}" method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-outline-danger">
            ❤️ Like {{ object.like_set.count }}
        </button>
    </form>

    <!-- Update & Delete Buttons -->
    {% if object.author == user %}
        <div class="mt-3">

            <a href="{% url 'post-update' object.id %}"
               class="btn btn-secondary">
                <i class="fas fa-edit"></i>
                Update
            </a>

            <a href="{% url 'post-delete' object.id %}"
               class="btn btn-danger">
                <i class="fas fa-trash"></i>
                Delete
            </a>

        </div>
    {% endif %}

</div>


</article>

{% endblock %}
