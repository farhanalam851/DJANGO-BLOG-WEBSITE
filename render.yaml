services:
  - type: web
    name: django-blog-website
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn bloggers.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: django-blog-db
          property: connectionString

      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: django-blog-db
